[project]
name = "churn-risk-scoring"
version = "0.1.0"
description = "Customer churn risk scoring CLI tool"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "scikit-learn>=1.3.0",
    "shap>=0.43.0",
    "sqlalchemy>=2.0.0",
    "matplotlib>=3.7.0",
    "pytest>=7.4.0",
]

[project.scripts]
churn-score = "churn_risk.cli:app"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
